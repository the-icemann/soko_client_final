name: Deploy Frontend

on:
  push:
    branches: [main, price_preds]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true # cancel queued deploy if a newer push comes in

jobs:
  build-and-deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Public API base URL — points to the EC2 NGINX gateway
          # Set as a GitHub Actions variable (not secret — it's not sensitive)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Sync build to S3
        run: |
          # Long cache for hashed assets (Vite content-hashes all JS/CSS)
          aws s3 sync dist/assets/ s3://${{ vars.FRONTEND_BUCKET }}/assets/ \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

          # Short cache for HTML (always check for new version)
          aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET }}/ \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "CloudFront invalidation triggered."
